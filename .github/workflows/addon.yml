name: Test Home Assistant app
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r addon/requirements.txt
      - run: node --test website/tests/*.test.mjs
      - run: python -m unittest discover -s addon -p 'test_*.py'
      - run: npm install --ignore-scripts --prefix matterport-house/scripts
      - run: python website/build.py
      - run: python -m unittest discover -s website/tests -p 'test_*.py'
      - run: docker build -t house-3d:test .
      - name: Test bridge in the built non-root container
        run: docker run --rm --entrypoint python -v "$PWD/addon/test_server.py:/app/test_server.py:ro" house-3d:test -m unittest test_server
