name: House 3D
version: "0.1.1"
slug: house_3d
description: Interactive 3D home with lights, temperatures, and climate controls
url: https://github.com/nathanboktae/house-3d
arch:
  - aarch64
  - amd64
startup: application
boot: auto
init: true
homeassistant_api: true
ingress: true
ingress_port: 8099
panel_admin: true
panel_icon: mdi:home-floor-3
panel_title: House 3D
options:
  default_view: dollhouse
schema:
  default_view: list(dollhouse|main-floor|basement|outside)
